  - PAY_AMT3
  - PAY_AMT4
  - PAY_AMT5
  - PAY_AMT6
  numeric_base:
  - LIMIT_BAL
  - AGE
validation:
  holdout_size: 0.2
  cv_folds: 5
  scoring: roc_auc
  stratify: true
