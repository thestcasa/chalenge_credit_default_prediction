    payment_to_previous_bill_4: false
    payment_to_previous_bill_5: false
    mean_payment_to_previous_bill: false
    min_payment_to_previous_bill: false
    max_payment_to_previous_bill: false
    num_low_previous_bill_coverage: false
    has_low_previous_bill_coverage: false
    num_delay_ge_2: false
    num_delay_ge_3: false
    has_severe_delay: false
    recent_delay_ge_2: false
    last3_num_delay_ge_2: false
    last3_max_delay: false
    zero_payment_positive_bill_1: false
    zero_payment_positive_bill_2: false
