    has_zero_payment_positive_bill: false
    recent_delay_x_recent_bill_to_limit: false
    num_delayed_months_x_mean_bill_to_limit: false
    has_recent_delay_x_recent_payment_to_recent_bill: false
preprocessing:
  one_hot_encode_categorical: true
  native_catboost_categorical: false
  handle_unknown_categories: ignore
  scale_numeric_for_linear_models: true
  normalize_unknown_categorical_codes: true
  education_unknown_to: 4
  marriage_unknown_to: 3
  clip_engineered_ratios: true
  ratio_lower_clip: -1.0
  ratio_upper_clip: 20.0
models:
  dummy: false
  logistic_regression: false
  random_forest: false
  extra_trees: false
  hist_gradient_boosting: false
  gradient_boosting: false
  xgboost: false
  lightgbm: false
  catboost: true
hyperparameter_tuning:
  enabled: true
  method: randomized_search
  n_iter: 50
  n_jobs: 2
  verbose: 1
  refit: true
threshold_tuning:
  enabled: true
  min_threshold: 0.29
  max_threshold: 0.34
  num_thresholds: 101
model_selection:
  primary_metric: holdout_macro_f1_tuned_threshold
param_grids:
  catboost:
    classifier__iterations:
    - 700
    - 900
    - 1100
    - 1300
    classifier__learning_rate:
    - 0.02
    - 0.025
    - 0.03
    classifier__depth:
    - 5
    - 6
    classifier__l2_leaf_reg:
    - 10
    - 15
    - 20
    - 25
    classifier__auto_class_weights:
    - null
oof_ensemble:
  enabled: true
  n_splits: 5
  shuffle: true
  average_method: mean
  tune_threshold_on_oof: false
  fixed_threshold: 0.328
  auto_blend_weights: false
  save_oof_predictions: false
  save_eval_probabilities: false
  output_submission: submission.csv
  oof_predictions_output:
  eval_probabilities_output:
  threshold_search_output:
  metrics_output:
  variants:
    catboost_d_seed_123:
      model_type: catboost
      weight: 1.0
      params:
        classifier__iterations: 1100
        classifier__learning_rate: 0.02
        classifier__depth: 6
        classifier__l2_leaf_reg: 25
        classifier__auto_class_weights: null
        classifier__thread_count: 2
  blend_weights: null
  blend_weight_search_output:
