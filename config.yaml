    num_zero_bills: true
    num_negative_bills: false
    has_negative_bill: false
    bill_trend: true
    recent_bill_to_limit: true
    mean_bill_to_limit: true
    max_bill_to_limit: true
    mean_payment: true
    max_payment: true
    min_payment: true
    std_payment: false
    total_payment: true
    num_zero_payments: true
    has_zero_payment: true
    payment_trend: true
    recent_payment_to_limit: true
    mean_payment_to_limit: true
    total_payment_to_total_bill: true
    mean_payment_to_mean_bill: true
    recent_payment_to_recent_bill: true
    payment_coverage_1: true
